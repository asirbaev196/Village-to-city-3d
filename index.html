<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Эхо: Сектор 7 - Мобильное управление</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Экран регистрации */
    #auth-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 5, 15, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; transition: opacity 1s ease; pointer-events: auto;
    }
    .glass-panel {
      background: rgba(0, 20, 30, 0.7); border: 1px solid rgba(0, 255, 204, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); border-radius: 16px; padding: 30px; 
      width: 90%; max-width: 350px; text-align: center;
    }
    h1 { color: #00ffcc; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,204,0.5); letter-spacing: 2px;}
    p.subtitle { color: #88aaaa; font-size: 12px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;}
    input {
      width: 100%; padding: 14px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.5); 
      border: 1px solid #005566; color: white; border-radius: 8px; font-size: 16px; text-align: center; outline: none;
    }
    button {
      width: 100%; padding: 14px; background: #00ffcc; color: #000; border: none; border-radius: 8px; 
      font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; pointer-events: auto;
    }

    /* Текст катсцены */
    #cinematic-text {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 22px; text-align: center; width: 80%; font-weight: bold;
      opacity: 0; transition: opacity 1s ease; z-index: 50; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    #alert-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.3); opacity: 0; transition: opacity 0.5s; z-index: 40;
    }

    /* Игровой интерфейс */
    #game-ui { display: none; opacity: 0; transition: opacity 1s; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;}
    
    #quest-hud {
      position: absolute; top: 20px; left: 20px; color: #00ffcc; text-shadow: 0 0 5px #00ffcc;
      font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 8px;
      border-left: 3px solid #00ffcc;
    }

    /* Зоны управления */
    #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 60%; pointer-events: auto; }
    #camera-zone { position: absolute; bottom: 0; right: 0; width: 50%; height: 60%; pointer-events: auto; }

    /* Джойстик */
    #joystick-base {
      position: absolute; width: 140px; height: 140px; border-radius: 50%;
      background: rgba(0, 255, 204, 0.1); border: 2px solid rgba(0, 255, 204, 0.3);
      display: none; transform: translate(-50%, -50%); pointer-events: none;
    }
    #joystick-stick {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      background: rgba(0, 255, 204, 0.8); box-shadow: 0 0 15px #00ffcc;
      top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }

    /* Кнопки действий */
    #action-buttons {
      position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto;
    }
    .act-btn {
      width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00ffcc;
      background: rgba(0, 20, 30, 0.6); color: #00ffcc; font-size: 28px;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); cursor: pointer; outline: none;
      backdrop-filter: blur(4px);
    }
    .act-btn:active { background: rgba(0, 255, 204, 0.4); transform: scale(0.9); }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div id="auth-screen">
      <div class="glass-panel">
        <h1>ЭХО</h1>
        <p class="subtitle">Сектор 7</p>
        <input type="text" id="username" placeholder="Введите позывной" maxlength="12" autocomplete="off">
        <button id="start-btn">Начать миссию</button>
      </div>
    </div>

    <div id="alert-overlay"></div>
    <div id="cinematic-text"></div>

    <div id="game-ui">
      <div id="quest-hud">Задание: Найти обломки (0/3)</div>
      
      <!-- Зона для левого джойстика -->
      <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-stick"></div></div>
      </div>

      <!-- Зона для свайпа камеры (правая половина) -->
      <div id="camera-zone"></div>
      
      <!-- Кнопки действий -->
      <div id="action-buttons">
        <button class="act-btn" id="btn-jump">🦘</button>
        <button class="act-btn" id="btn-camera">📷</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- ГЕНЕРАТОР ТЕКСТУР ---
    function createPlanetTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      if (type === 'moon') {
        ctx.fillStyle = '#aaaaaa'; ctx.fillRect(0, 0, 512, 256);
        for(let i = 0; i < 150; i++) {
          const x = Math.random() * 512; const y = Math.random() * 256; const r = Math.random() * 8 + 2;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(50, 50, 50, ${Math.random() * 0.5 + 0.2})`; ctx.fill();
          ctx.beginPath(); ctx.arc(x - 1, y - 1, r * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(200, 200, 200, 0.3)'; ctx.fill();
        }
      } else if (type === 'earth') {
        ctx.fillStyle = '#1133aa'; ctx.fillRect(0, 0, 512, 256);
        for(let i = 0; i < 30; i++) {
          ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 40 + 10, 0, Math.PI * 2);
          ctx.fillStyle = '#22aa44'; ctx.fill();
        }
        for(let i = 0; i < 50; i++) {
          ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 20, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill();
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x334455, 1.5);
    scene.add(ambientLight);
    const playerLight = new THREE.PointLight(0xaaccff, 3, 15);
    scene.add(playerLight);

    // --- КОСМОС ---
    const starsGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(2000 * 3);
    for(let i = 0; i < 2000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 1000;
    starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }));
    scene.add(stars);

    const earth = new THREE.Mesh(new THREE.SphereGeometry(40, 64, 64), new THREE.MeshStandardMaterial({ map: createPlanetTexture('earth'), emissive: 0x001133, roughness: 0.8 }));
    earth.position.set(-150, -30, -200); scene.add(earth);

    const moon = new THREE.Mesh(new THREE.SphereGeometry(20, 64, 64), new THREE.MeshStandardMaterial({ map: createPlanetTexture('moon'), roughness: 1 }));
    moon.position.set(0, -30, -100); scene.add(moon);

    const rocket = new THREE.Group();
    const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 5, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
    rBody.rotation.x = Math.PI / 2; rocket.add(rBody);
    const rFire = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 8), new THREE.MeshBasicMaterial({ color: 0x00aaff }));
    rFire.rotation.x = Math.PI / 2; rFire.position.z = 3.5; rocket.add(rFire);
    rocket.position.set(-50, 20, 50); scene.add(rocket);

    // --- ПЛАНЕТА (УРОВЕНЬ) ---
    const planetGroup = new THREE.Group();
    planetGroup.visible = false; scene.add(planetGroup);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 32, 32), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; planetGroup.add(ground);

    const grid = new THREE.GridHelper(200, 50, 0x00ffcc, 0x003333);
    grid.position.y = 0.1; planetGroup.add(grid);

    const debrisList = [];
    for(let i = 0; i < 3; i++) {
      const deb = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.3 }));
      deb.position.set((Math.random() - 0.5) * 30, 0.25, (Math.random() - 0.5) * 30);
      deb.castShadow = true; planetGroup.add(deb);
      debrisList.push({ mesh: deb, collected: false });
    }

    // --- ПЕРСОНАЖ ---
    const character = new THREE.Group();
    planetGroup.add(character);
    let mixer, walkAction, isModelLoaded = false;

    const loader = new GLTFLoader();
    loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.8, 0.8, 0.8);
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.material = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4, metalness: 0.6, skinning: true });
          if (child.name.includes('Head')) { child.material.color.setHex(0x111111); child.material.metalness = 1; }
        }
      });
      character.add(model);
      mixer = new THREE.AnimationMixer(model);
      const walkClip = gltf.animations.find(clip => clip.name.toLowerCase() === 'walk');
      if (walkClip) { walkAction = mixer.clipAction(walkClip); walkAction.play(); walkAction.paused = true; }
      isModelLoaded = true;
    });

    // ==========================================
    // 1. УПРАВЛЕНИЕ КАМЕРОЙ (Свайп справа)
    // ==========================================
    let camTheta = Math.PI; // Горизонтальный угол (вокруг персонажа)
    let camPhi = Math.PI / 4; // Вертикальный угол (наклон)
    const camRadius = 7; // Дистанция камеры
    const minPhi = 0.1, maxPhi = Math.PI / 2 - 0.1;

    const camZone = document.getElementById('camera-zone');
    let isDraggingCam = false;
    let prevCamX = 0, prevCamY = 0;

    camZone.addEventListener('pointerdown', (e) => {
      isDraggingCam = true;
      prevCamX = e.clientX;
      prevCamY = e.clientY;
    });

    camZone.addEventListener('pointermove', (e) => {
      if (!isDraggingCam) return;
      const dx = e.clientX - prevCamX;
      const dy = e.clientY - prevCamY;
      
      camTheta -= dx * 0.01; // Горизонтальный свайп
      camPhi -= dy * 0.01;   // Вертикальный свайп
      
      // Ограничиваем наклон, чтобы не улететь под землю или наверх
      camPhi = Math.max(minPhi, Math.min(maxPhi, camPhi));
      
      prevCamX = e.clientX;
      prevCamY = e.clientY;
    });

    const endCamDrag = () => { isDraggingCam = false; };
    camZone.addEventListener('pointerup', endCamDrag);
    camZone.addEventListener('pointercancel', endCamDrag);

    // Кнопка смены камеры (дистанция)
    let camMode = 0; // 0: обычная, 1: близко, 2: от 1 лица
    document.getElementById('btn-camera').addEventListener('click', () => {
      camMode = (camMode + 1) % 3;
      if(isModelLoaded) character.children[0].visible = (camMode !== 2);
    });

    // ==========================================
    // 2. УПРАВЛЕНИЕ ПЕРСОНАЖЕМ (Джойстик слева)
    // ==========================================
    let moveVector = new THREE.Vector2(0, 0);
    let isJumping = false, jumpVelocity = 0;
    const GRAVITY = -20;

    const jZone = document.getElementById('joystick-zone');
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const maxDist = 50; // Радиус стика

    let touchId = null, centerX = 0, centerY = 0;

    jZone.addEventListener('pointerdown', (e) => {
      if (touchId !== null) return;
      touchId = e.pointerId;
      centerX = e.clientX; centerY = e.clientY;
      jBase.style.display = 'block';
      jBase.style.left = centerX + 'px'; jBase.style.top = centerY + 'px';
      jStick.style.transform = `translate(-50%, -50%)`;
    });

    jZone.addEventListener('pointermove', (e) => {
      if (e.pointerId !== touchId) return;
      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      let dist = Math.hypot(dx, dy);
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      
      jStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      moveVector.x = dx / maxDist;
      moveVector.y = dy / maxDist;
    });

    const endTouch = (e) => {
      if (e.pointerId !== touchId) return;
      touchId = null; jBase.style.display = 'none'; moveVector.set(0, 0);
    };
    jZone.addEventListener('pointerup', endTouch);
    jZone.addEventListener('pointercancel', endTouch);

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!isJumping) { isJumping = true; jumpVelocity = 8; }
    });

    // ==========================================
    // 3. ГЛАВНЫЙ ЦИКЛ
    // ==========================================
    const clock = new THREE.Clock();
    let gameState = 'MENU'; 
    
    const authScreen = document.getElementById('auth-screen');
    const startBtn = document.getElementById('start-btn');
    const usernameInput = document.getElementById('username');
    const cinematicText = document.getElementById('cinematic-text');
    const alertOverlay = document.getElementById('alert-overlay');
    const gameUI = document.getElementById('game-ui');
    const questHud = document.getElementById('quest-hud');
    let questCount = 0;

    function showText(text, dur) {
      cinematicText.innerText = text;
      cinematicText.style.opacity = 1;
      setTimeout(() => cinematicText.style.opacity = 0, dur);
    }

    startBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim() || "Пилот";
      authScreen.style.opacity = '0';
      setTimeout(() => authScreen.style.display = 'none', 1000);
      gameState = 'FLYING';
      showText(`Пилот ${name}, стыковка...`, 2000);
      setTimeout(() => {
        showText("ВНИМАНИЕ! ОТКАЗ СИСТЕМ!", 3000);
        alertOverlay.style.opacity = 1;
        setTimeout(() => {
          showText("Крушение...", 2000);
          gameState = 'CRASH';
        }, 1500);
      }, 2500);
    });

    camera.position.set(0, 20, 80);
    camera.lookAt(-50, 20, 50);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      if (gameState === 'MENU') {
        camera.position.x = Math.sin(time * 0.5) * 5;
        camera.lookAt(-50, 20, 50);
        earth.rotation.y += dt * 0.05;
      }
      else if (gameState === 'FLYING') {
        rocket.position.z -= 15 * dt; rocket.position.x += 2 * dt; rocket.position.y -= 2 * dt;
        camera.position.lerp(new THREE.Vector3(rocket.position.x + 10, rocket.position.y + 5, rocket.position.z + 15), 2 * dt);
        camera.lookAt(rocket.position);
      }
      else if (gameState === 'CRASH') {
        rocket.position.z -= 40 * dt; rocket.position.y -= 10 * dt;
        camera.position.x += (Math.random() - 0.5) * 0.8; camera.position.y += (Math.random() - 0.5) * 0.8;
        camera.lookAt(rocket.position);
        if (rocket.position.y < -25) {
          gameState = 'GAME';
          scene.background = new THREE.Color(0x050510);
          earth.visible = false; moon.visible = false; stars.visible = false; rocket.visible = false;
          alertOverlay.style.opacity = 0;
          planetGroup.visible = true;
          gameUI.style.display = 'block';
          setTimeout(() => gameUI.style.opacity = '1', 100);
          showText("Выживших нет. Найди обломки для связи.", 3000);
        }
      }

      if (gameState === 'GAME' && isModelLoaded) {
        
        // Движение (зависит от камеры)
        const isWalking = moveVector.lengthSq() > 0.01;
        if (isWalking) {
          const speed = 6;
          // Вычисляем направление движения относительно угла камеры
          const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camTheta);
          const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camTheta);
          
          // moveVector.y инвертирован (вверх = вперед)
          const moveDir = forward.multiplyScalar(-moveVector.y).add(right.multiplyScalar(moveVector.x));
          moveDir.normalize();

          character.position.addScaledVector(moveDir, speed * dt);
          
          // Поворот модели в сторону движения
          const targetRot = Math.atan2(moveDir.x, moveDir.z);
          let diff = targetRot - character.rotation.y;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          character.rotation.y += diff * Math.min(1, 10 * dt);
        }

        // Прыжок
        if (isJumping) {
          character.position.y += jumpVelocity * dt;
          jumpVelocity += GRAVITY * dt;
          if (character.position.y <= 0) { character.position.y = 0; isJumping = false; jumpVelocity = 0; }
        }

        if (walkAction) walkAction.paused = !isWalking;
        if (mixer) mixer.update(dt);

        playerLight.position.copy(character.position); playerLight.position.y += 2;

        // Сбор обломков
        debrisList.forEach((d) => {
          if (!d.collected) {
            const dist = character.position.distanceTo(d.mesh.position);
            if (dist < 2) {
              d.collected = true; planetGroup.remove(d.mesh);
              questCount++;
              questHud.innerText = `Задание: Найти обломки (${questCount}/3)`;
              if (questCount === 3) showText("Связь восстановлена! Глава 1 завершена.", 4000);
              else showText(`Обломок найден! Осталось: ${3 - questCount}`, 1500);
            }
          }
        });

        // Позиционирование камеры
        const targetLookAt = new THREE.Vector3().copy(character.position);
        targetLookAt.y += 1.5;

        if (camMode === 2) {
          // От 1 лица
          const eyePos = new THREE.Vector3(0, 1.6, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camTheta);
          camera.position.copy(character.position).add(eyePos);
          const lookDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camTheta);
          camera.lookAt(camera.position.clone().add(lookDir));
        } else {
          // 3-е лицо (Средняя / Малая)
          let radius = camMode === 0 ? 7 : 4;
          // Сферические координаты камеры
          const offsetX = radius * Math.sin(camPhi) * Math.sin(camTheta);
          const offsetY = radius * Math.cos(camPhi);
          const offsetZ = radius * Math.sin(camPhi) * Math.cos(camTheta);
          
          const targetCamPos = new THREE.Vector3().copy(character.position).add(new THREE.Vector3(offsetX, offsetY, offsetZ));
          
          camera.position.lerp(targetCamPos, 10 * dt);
          camera.lookAt(targetLookAt);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
